
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eldoria — Campfire</title>
<link rel="icon" href="eldoria-icon.jpg">

<style>
/* ═══════════════════════════════════════════════
   CSS VARIABLES (from press.html / style.css)
═══════════════════════════════════════════════ */
:root {
  --font-gothic:   'Cinzel Decorative', 'Palatino Linotype', Georgia, serif;
  --font-heading:  'Cinzel', 'Palatino Linotype', Georgia, serif;
  --font-body:     'EB Garamond', Georgia, 'Times New Roman', serif;

  --gold:          #c8a84b;
  --gold-dark:     #7a5c18;
  --gold-dim:      #6a4e14;
  --silver-dark:   #8a8a9a;
  --dark-panel:    rgba(10,8,4,0.88);
  --dark-border:   rgba(120,90,30,0.35);
  --text-muted:    rgba(200,185,150,0.7);
  --glow-gold:     0 0 18px rgba(200,168,75,0.55), 0 0 40px rgba(200,168,75,0.2);

  /* theme defaults (dark) */
  --bg-body:       #08060e;
  --nav-bg:        rgba(4,3,8,0.92);
  --nav-border:    rgba(100,75,25,0.4);
}
body.mode-normal {
  --bg-body:    #1a1508;
  --nav-bg:     rgba(20,16,6,0.95);
}
body.mode-bright {
  --bg-body:    #f0ead8;
  --nav-bg:     rgba(240,235,215,0.97);
  --gold:       #7a5010;
  --gold-dark:  #5a3a08;
  --text-muted: rgba(80,60,20,0.8);
  --silver-dark:#555566;
}

/* ═══════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-body);
  transition: background 0.4s;
}

/* ═══════════════════════════════════════════════
   NAVBAR  (from press.html)
═══════════════════════════════════════════════ */
#navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 58px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  background: var(--nav-bg);
  border-bottom: 1px solid var(--nav-border);
  backdrop-filter: blur(10px);
  gap: 10px;
}
.nav-logo img {
  height: 36px;
  width: 36px;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid var(--gold-dark);
  display: block;
}
.nav-links {
  display: flex;
  list-style: none;
  gap: 4px;
  align-items: center;
  flex: 1;
  margin-left: 10px;
}
.nav-item { position: relative; }
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 36px;
  min-width: 70px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 4px;
  font-family: var(--font-heading);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  overflow: hidden;
  transition: border-color 0.25s, background 0.25s, color 0.25s;
  position: relative;
}
.nav-btn:hover {
  border-color: var(--gold-dark);
  background: rgba(200,168,75,0.07);
  color: var(--gold);
}
.nav-btn .label-main,
.nav-btn .label-hover {
  display: block;
  transition: transform 0.3s ease, opacity 0.3s ease;
  position: absolute;
}
.nav-btn .label-main  { transform: translateY(0);    opacity: 1; }
.nav-btn .label-hover { transform: translateY(18px); opacity: 0; }
.nav-btn:hover .label-main  { transform: translateY(-18px); opacity: 0; }
.nav-btn:hover .label-hover { transform: translateY(0);     opacity: 1; }

/* Social + Info dropdowns */
.social-wrapper,
.info-wrapper { position: relative; }

.social-toggle,
.info-toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  font-family: var(--font-heading);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color 0.25s, background 0.25s, color 0.25s;
}
.social-toggle:hover,
.info-toggle:hover {
  border-color: var(--gold-dark);
  background: rgba(200,168,75,0.07);
  color: var(--gold);
}
.social-toggle .arrow,
.info-toggle .arrow {
  display: inline-block;
  transition: transform 0.3s;
  font-size: 0.6rem;
}
.social-toggle.open .arrow,
.info-toggle.open .arrow { transform: rotate(180deg); }

.social-scroll,
.info-scroll {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--nav-bg);
  border: 1px solid var(--gold-dark);
  border-radius: 6px;
  min-width: 160px;
  padding: 8px 0;
  z-index: 300;
  backdrop-filter: blur(12px);
}
.social-scroll.open,
.info-scroll.open { display: block; }

.social-link,
.info-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  font-family: var(--font-heading);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  transition: background 0.2s, color 0.2s;
}
.social-link:hover,
.info-link:hover {
  background: rgba(200,168,75,0.1);
  color: var(--gold);
}
.social-icon { font-size: 0.75rem; color: var(--gold-dim); }

.nav-right { margin-left: auto; }
.settings-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--gold-dark);
  background: transparent;
  color: var(--text-muted);
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.25s, color 0.25s, border-color 0.25s;
  display: flex; align-items: center; justify-content: center;
}
.settings-btn:hover {
  background: rgba(200,168,75,0.12);
  color: var(--gold);
  border-color: var(--gold);
}

/* ═══════════════════════════════════════════════
   SETTINGS PANEL  (from press.html)
═══════════════════════════════════════════════ */
#settings-panel {
  position: fixed;
  top: 66px; right: 14px;
  z-index: 250;
  width: 240px;
  background: var(--dark-panel);
  border: 1px solid var(--gold-dark);
  border-radius: 8px;
  padding: 18px;
  display: none;
  backdrop-filter: blur(16px);
}
#settings-panel.open { display: block; }

.settings-header {
  font-family: var(--font-heading);
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--dark-border);
}
.settings-section { margin-bottom: 16px; }
.settings-label {
  font-family: var(--font-heading);
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--silver-dark);
  margin-bottom: 10px;
}

/* Mode buttons */
.mode-buttons { display: flex; gap: 6px; }
.mode-btn {
  flex: 1;
  padding: 6px 4px;
  border: 1px solid var(--dark-border);
  border-radius: 4px;
  background: transparent;
  font-family: var(--font-heading);
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.mode-btn.active,
.mode-btn:hover {
  border-color: var(--gold-dark);
  background: rgba(200,168,75,0.1);
  color: var(--gold);
}

/* Toggle rows */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.toggle-label {
  font-family: var(--font-heading);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  color: var(--text-muted);
}
.toggle-switch { position: relative; display: inline-block; width: 36px; height: 20px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: rgba(80,60,20,0.4);
  border: 1px solid var(--gold-dark);
  border-radius: 20px;
  transition: background 0.3s;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  height: 14px; width: 14px;
  left: 2px; top: 2px;
  background: var(--gold-dim);
  border-radius: 50%;
  transition: transform 0.3s;
}
input:checked + .toggle-slider { background: rgba(200,168,75,0.25); }
input:checked + .toggle-slider::before { transform: translateX(16px); background: var(--gold); }

/* ═══════════════════════════════════════════════
   PARTICLES CANVAS
═══════════════════════════════════════════════ */
#particles-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.35;
}

/* ═══════════════════════════════════════════════
   AUDIO INDICATOR
═══════════════════════════════════════════════ */
#audio-indicator {
  position: fixed;
  bottom: 16px; left: 16px;
  z-index: 100;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-heading);
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-dim);
  transition: opacity 0.5s;
  opacity: 0.7;
}
#audio-indicator.muted .bars { opacity: 0.3; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.bar {
  width: 3px;
  background: var(--gold-dim);
  border-radius: 2px;
  animation: barBounce 0.8s ease-in-out infinite alternate;
}
.bar:nth-child(1) { height: 6px;  animation-delay: 0s; }
.bar:nth-child(2) { height: 12px; animation-delay: 0.15s; }
.bar:nth-child(3) { height: 8px;  animation-delay: 0.3s; }
.bar:nth-child(4) { height: 10px; animation-delay: 0.1s; }
@keyframes barBounce {
  from { transform: scaleY(0.4); }
  to   { transform: scaleY(1); }
}
#audio-indicator.muted .bar { animation: none; transform: scaleY(0.4); }

/* ═══════════════════════════════════════════════
   SCENE — pushed down by navbar height (58px)
═══════════════════════════════════════════════ */
.scene {
  width: 100vw;
  height: calc(100vh - 58px);
  margin-top: 58px;
  min-height: 480px;
  background: radial-gradient(ellipse 90% 55% at 50% 100%, #1c0800 0%, #0d0308 40%, #030008 100%);
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 28px;
  overflow: hidden;
  position: relative;
  font-family: Georgia, 'Times New Roman', Times, serif;
}

/* ═══════════════════════════════════════════════
   STARS
═══════════════════════════════════════════════ */
.stars { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.star  { position: absolute; border-radius: 50%; background: #fff; animation: twinkle linear infinite; }
@keyframes twinkle { 0%,100%{opacity:.1} 50%{opacity:.85} }

/* ═══════════════════════════════════════════════
   HALF MOON
═══════════════════════════════════════════════ */
.moon-wrap {
  position: absolute; top: 38px; right: 90px;
  width: 72px; height: 72px; z-index: 2;
  filter: drop-shadow(0 0 18px rgba(200,210,255,.35)) drop-shadow(0 0 6px rgba(180,195,255,.25));
  animation: moonbob 8s ease-in-out infinite alternate;
}
@keyframes moonbob { from{transform:translateY(0px)} to{transform:translateY(6px)} }
.moon-lit {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 38% 42%, #f8f0d8 0%, #e8d8a0 28%, #c8b060 55%, #8a6820 80%, transparent 100%);
}
.moon-shadow {
  position: absolute; width: 64px; height: 64px; top: 4px; left: 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 42%, #03000a 0%, #06010e 50%, rgba(3,0,10,.92) 75%, rgba(3,0,10,0) 100%);
}
.moon-halo {
  position: absolute; inset: -10px; border-radius: 50%;
  background: radial-gradient(circle at 55% 50%, transparent 45%, rgba(160,175,230,.07) 65%, rgba(140,155,220,.04) 80%, transparent 100%);
}
.moon-star { position: absolute; background: #e8e0cc; border-radius: 50%; animation: twinkle linear infinite; }

/* ═══════════════════════════════════════════════
   GROUND & DIRT
═══════════════════════════════════════════════ */
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 42px; z-index: 3;
  background: linear-gradient(to top, #150a02 0%, #0e0601 60%, transparent 100%);
  border-radius: 0 0 12px 12px;
}
.ground-dirt {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 320px; height: 28px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; z-index: 4;
  background: radial-gradient(ellipse at 50% 100%, #2e1608 0%, #1c0e04 55%, transparent 100%);
}

/* ═══════════════════════════════════════════════
   STONE RING
═══════════════════════════════════════════════ */
.stones {
  position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
  width: 210px; height: 38px; z-index: 10;
}
.stone {
  position: absolute; bottom: 0;
  border-radius: 45% 50% 48% 42%/52% 48% 55% 45%;
  box-shadow:
    inset 0 3px 5px rgba(255,220,160,.12),
    inset 0 -4px 6px rgba(0,0,0,.6),
    inset 2px 0 4px rgba(255,200,100,.07),
    inset -2px 0 4px rgba(0,0,0,.4),
    0 2px 6px rgba(0,0,0,.7);
}
.stone::before { content:''; position:absolute; background:rgba(0,0,0,.25); border-radius:50%; }
.stone::after  { content:''; position:absolute; background:rgba(255,200,120,.08); border-radius:50%; }
.s1{width:38px;height:24px;left:0px;   background:linear-gradient(145deg,#4a3820 0%,#2e2010 40%,#1e1408 100%)}
.s1::before{width:18px;height:3px;top:8px;left:5px;transform:rotate(-8deg)}
.s1::after{width:30px;height:8px;top:2px;left:4px}
.s2{width:32px;height:20px;left:28px;bottom:2px; background:linear-gradient(145deg,#524030 0%,#382818 45%,#221605 100%)}
.s2::before{width:14px;height:2px;top:6px;left:8px;transform:rotate(12deg)}
.s2::after{width:24px;height:6px;top:2px;left:4px}
.s3{width:42px;height:26px;left:52px;  background:linear-gradient(155deg,#3e3020 0%,#2a1e0e 38%,#1a1208 100%)}
.s3::before{width:20px;height:3px;top:9px;left:6px;transform:rotate(-5deg)}
.s3::after{width:34px;height:10px;top:1px;left:4px}
.s4{width:36px;height:22px;left:88px;bottom:1px; background:linear-gradient(140deg,#483820 0%,#302008 42%,#1c1206 100%)}
.s4::before{width:16px;height:2px;top:7px;left:9px;transform:rotate(9deg)}
.s4::after{width:28px;height:7px;top:2px;left:5px}
.s5{width:44px;height:27px;left:116px; background:linear-gradient(150deg,#564238 0%,#362415 40%,#1e1408 100%)}
.s5::before{width:22px;height:3px;top:10px;left:5px;transform:rotate(-11deg)}
.s5::after{width:36px;height:10px;top:2px;left:4px}
.s6{width:34px;height:21px;left:152px;bottom:2px;background:linear-gradient(145deg,#403018 0%,#281c08 40%,#181005 100%)}
.s6::before{width:15px;height:2px;top:7px;left:7px;transform:rotate(7deg)}
.s6::after{width:26px;height:6px;top:2px;left:4px}
.s7{width:28px;height:18px;left:178px; background:linear-gradient(145deg,#4c3a28 0%,#302010 42%,#1a1206 100%)}
.s7::before{width:12px;height:2px;top:6px;left:6px;transform:rotate(-6deg)}
.s7::after{width:22px;height:6px;top:1px;left:3px}

.stone-glow {
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  width:200px;height:14px;border-radius:50%;z-index:9;
  background:radial-gradient(ellipse at center,hsla(18,100%,48%,.45) 0%,transparent 75%);
  mix-blend-mode:screen;
  animation:sglow .9s ease-in-out infinite alternate;
}
@keyframes sglow { from{opacity:.4;transform:translateX(-50%) scaleX(1)} to{opacity:.85;transform:translateX(-50%) scaleX(1.1)} }

/* ═══════════════════════════════════════════════
   LOGS
═══════════════════════════════════════════════ */
.logs { position:relative;width:200px;height:34px;z-index:11;margin-bottom:0; }
.log { position:absolute;height:14px;border-radius:7px;overflow:hidden; }
.log::before {
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0px,rgba(0,0,0,.08) 2px,transparent 4px,rgba(255,180,60,.04) 6px,transparent 8px);
}
.log::after {
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,200,100,.18) 0%,transparent 35%,rgba(0,0,0,.4) 100%);
}
.log1{width:175px;left:12px;top:14px;background:linear-gradient(to bottom,#4a2808,#2e1606,#1e0e04);transform:rotate(-15deg);transform-origin:right center;box-shadow:0 3px 8px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,180,60,.15);}
.log2{width:175px;left:12px;top:14px;background:linear-gradient(to bottom,#442406,#2a1405,#1a0e04);transform:rotate(15deg);transform-origin:left center;box-shadow:0 3px 8px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,180,60,.12);}
.log3{width:135px;left:32px;top:18px;height:12px;background:linear-gradient(to bottom,#502c0a,#321808,#200e05);transform:rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,180,60,.1);}
.log-end {
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 40% 38%, #5a3010 0%, #2e1408 55%, #180a02 100%);
  border:1px solid rgba(0,0,0,.4);
}
.log1::before,.log2::before,.log3::before { animation:logburn 1.6s ease-in-out infinite alternate; }
@keyframes logburn { from{opacity:.3} to{opacity:1} }

.coals {
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  width:160px;height:12px;border-radius:50%;z-index:8;
  background:radial-gradient(ellipse at center,hsla(18,100%,50%,.9) 0%,hsla(10,100%,35%,.65) 35%,hsla(5,90%,18%,.45) 65%,transparent 100%);
  mix-blend-mode:screen;filter:blur(2px);
  animation:coalflicker .55s ease-in-out infinite alternate;
}
@keyframes coalflicker { from{opacity:.65;transform:translateX(-50%) scaleX(1)} to{opacity:1;transform:translateX(-50%) scaleX(1.07)} }

/* ═══════════════════════════════════════════════
   GROUND GLOW POOL & SHIMMER RINGS
═══════════════════════════════════════════════ */
.glow-pool {
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  width:280px;height:36px;border-radius:50%;z-index:5;
  background:radial-gradient(ellipse at center,hsla(20,100%,50%,.65) 0%,hsla(12,100%,35%,.32) 45%,transparent 75%);
  mix-blend-mode:screen;filter:blur(6px);
  animation:poolpulse 1.1s ease-in-out infinite alternate;
}
@keyframes poolpulse {
  from{transform:translateX(-50%) scaleX(1) scaleY(1);opacity:.6}
  to  {transform:translateX(-50%) scaleX(1.18) scaleY(1.35);opacity:1}
}
.ring {
  position:absolute;left:50%;bottom:52px;
  border-radius:50%;transform:translateX(-50%);
  animation:shimmer ease-out infinite;z-index:6;
}
.r1{animation-duration:2.6s;animation-delay:0s}
.r2{animation-duration:2.6s;animation-delay:-.87s}
.r3{animation-duration:2.6s;animation-delay:-1.74s}
@keyframes shimmer {
  0%  {width:45px;height:20px;border:1.5px solid hsla(22,100%,55%,.55);opacity:1}
  100%{width:300px;height:85px;border:1.5px solid hsla(22,100%,55%,0);opacity:0}
}

/* ═══════════════════════════════════════════════
   FIRE
═══════════════════════════════════════════════ */
.fire {
  position:absolute;bottom:34px;left:50%;
  width:160px;height:300px;
  transform:translateX(-50%);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:12;
}
.f{position:absolute;bottom:0;left:50%;transform-origin:center bottom;mix-blend-mode:screen}
.f1{width:145px;height:105px;margin-left:-72px;border-radius:50% 50% 46% 46%/52% 52% 48% 48%;background:radial-gradient(ellipse 70% 65% at 50% 60%,hsla(10,100%,52%,.95) 0%,hsla(5,100%,36%,.65) 45%,transparent 85%);animation:blob 1.25s ease-in-out infinite alternate,bsway 2.2s ease-in-out infinite alternate;filter:blur(1.5px)}
.f2{width:145px;height:105px;margin-left:-72px;border-radius:50% 50% 46% 46%/52% 52% 48% 48%;background:radial-gradient(ellipse 70% 65% at 50% 60%,hsla(18,100%,56%,.8) 0%,hsla(10,100%,38%,.55) 45%,transparent 85%);animation:blob 1.25s ease-in-out infinite alternate-reverse,bsway 2.2s ease-in-out infinite alternate-reverse;filter:blur(1.5px)}
@keyframes blob{from{transform:scaleX(1.06) scaleY(.94)}to{transform:scaleX(.93) scaleY(1.09)}}
@keyframes bsway{from{transform:rotate(-6deg) scaleX(1.05)}to{transform:rotate(6deg) scaleX(.95)}}

/* ─── AUDIO ─── */
function playSound(src){
  if(!src) return;
  try{ const a=new Audio(src); a.volume=0.85; a.play().catch(()=>{}); }catch(e){}
}

/* ─── SEQUENCER ─── */
const msgLine  = document.getElementById('msgLine');
const btnAgain = document.getElementById('btnAgain');
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function setLineOpacity(op, ms){
  return new Promise(r=>{
    msgLine.style.transition=`opacity ${ms}ms ease`;
    msgLine.style.opacity=op;
    setTimeout(r, ms);
  });
}
async function runSequence(){
  btnAgain.classList.remove('visible');
  msgLine.style.opacity='0';
  msgLine.textContent='';
  for(let i=0;i<LINES.length;i++){
    const L=LINES[i];
    msgLine.innerHTML=`
      ${L.image?`<img src="${L.image}" style="width:${L.imgWidth||60}px;height:${L.imgHeight||60}px;transform:translate(${L.imgX||0}px,${L.imgY||0}px);margin-bottom:10px;">` : ""}
      <div>${L.text.replace(/\n/g,'<br>')}</div>`;
    playSound(L.sound);
    await setLineOpacity(1, L.fadeIn);
    await wait(L.duration);
    await setLineOpacity(0, L.fadeOut);
    await wait(280);
  }
  btnAgain.classList.add('visible');
}

function setupDropdown(toggleId, scrollId){
  const btn = document.getElementById(toggleId);
  const menu = document.getElementById(scrollId);
  if(!btn||!menu) return;
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    const isOpen = menu.classList.contains('open');
    // close all dropdowns first
    document.querySelectorAll('.social-scroll, .info-scroll').forEach(m=>m.classList.remove('open'));
    document.querySelectorAll('.social-toggle, .info-toggle').forEach(t=>t.classList.remove('open'));
    if(!isOpen){ menu.classList.add('open'); btn.classList.add('open'); }
  });
}

const canvas  = document.getElementById('particles-canvas');

/* ═══════════════════════════════════════════════
   PARTICLES CANVAS (floating gold dust)
═══════════════════════════════════════════════ */
(function initParticles(){
  const ctx = canvas.getContext('2d');
  let particles = [];
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  for(let i=0;i<60;i++){
    particles.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      r: Math.random()*1.5+0.3,
      vx: (Math.random()-.5)*0.4,
      vy: -(Math.random()*0.5+0.1),
      a: Math.random(),
      da: (Math.random()*0.005+0.002)*(Math.random()<.5?1:-1)
    });
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.a += p.da;
      if(p.a<=0||p.a>=1) p.da*=-1;
      if(p.y<-5){ p.y=canvas.height+5; p.x=Math.random()*canvas.width; }
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,168,75,${Math.max(0,Math.min(1,p.a))})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
